<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Vorlage für assets/og-image.jpg (1200×627). Neu erzeugen, z. B. mit Edge:
     msedge --headless=new --window-size=1200,627 --screenshot=og.png tools/og-image.html
     und als JPEG speichern. Nicht verlinkt, nur Arbeitsdatei. -->
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body {
    position: relative;
    background:
      radial-gradient(900px 500px at 85% 40%, rgba(88, 166, 255, .10), transparent 60%),
      radial-gradient(600px 400px at 10% 110%, rgba(63, 185, 80, .08), transparent 60%),
      #0d1117;
    color: #e6edf3;
    font-family: "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "Cascadia Code", "Cascadia Mono", Consolas, monospace; }

  /* Git-Graph als Dekoration rechts */
  svg.graph { position: absolute; inset: 0; }

  .content { position: absolute; left: 72px; top: 64px; width: 640px; }
  .prompt { font-size: 22px; color: #8b949e; margin-bottom: 34px; }
  .prompt .u { color: #3fb950; }
  .prompt .p { color: #58a6ff; }
  .prompt .cur { color: #e6edf3; }
  h1 { font-size: 66px; line-height: 1.05; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 18px; }
  .role { font-size: 29px; color: #58a6ff; font-weight: 500; margin-bottom: 30px; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; }
  .chip {
    font-size: 20px;
    padding: 7px 16px;
    border-radius: 999px;
    border: 1.5px solid;
  }
  .c0 { color: #f0883e; border-color: rgba(240, 136, 62, .55); background: rgba(240, 136, 62, .08); }
  .c1 { color: #58a6ff; border-color: rgba(88, 166, 255, .55); background: rgba(88, 166, 255, .08); }
  .c2 { color: #d2a8ff; border-color: rgba(210, 168, 255, .55); background: rgba(210, 168, 255, .08); }
  .c3 { color: #3fb950; border-color: rgba(63, 185, 80, .55); background: rgba(63, 185, 80, .08); }

  .domain {
    position: absolute;
    left: 72px;
    bottom: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 26px;
    color: #e6edf3;
  }
  .domain .tag {
    font-size: 18px;
    color: #3fb950;
    border: 1.5px solid rgba(63, 185, 80, .6);
    border-radius: 999px;
    padding: 3px 12px;
  }

  /* Porträt mit Verlaufsring wie auf der Seite */
  .avatar {
    position: absolute;
    left: 812px;
    top: 150px;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    padding: 7px;
    background: conic-gradient(#58a6ff, #3fb950, #d2a8ff, #f0883e, #58a6ff);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .55);
  }
  .avatar img {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 6px solid #0d1117;
    object-fit: cover;
  }
</style>
</head>
<body>
  <svg class="graph" viewBox="0 0 1200 627" aria-hidden="true">
    <g fill="none" stroke-width="5" stroke-linecap="round" opacity=".9">
      <!-- main (blau) -->
      <path d="M962 -10 V 140" stroke="#58a6ff"/>
      <path d="M962 460 V 640" stroke="#58a6ff"/>
      <!-- research/phd (lila): zweigt ab und kommt zurück -->
      <path d="M962 520 C 962 545, 1150 540, 1150 515 V 110 C 1150 85, 962 85, 962 60" stroke="#d2a8ff" opacity=".85"/>
      <!-- study/dual (grün) -->
      <path d="M962 600 C 962 590, 780 590, 780 570 V 520" stroke="#3fb950" opacity=".7"/>
      <!-- feature/data-mesh (orange) -->
      <path d="M962 120 C 962 100, 1060 100, 1060 80 V 20" stroke="#f0883e" opacity=".85"/>
    </g>
    <g stroke="#0d1117" stroke-width="4">
      <circle cx="962" cy="20" r="11" fill="#58a6ff"/>
      <circle cx="962" cy="120" r="11" fill="#58a6ff"/>
      <circle cx="1060" cy="40" r="11" fill="#0d1117" stroke="#f0883e" stroke-dasharray="5 4"/>
      <circle cx="1150" cy="200" r="10" fill="#d2a8ff"/>
      <circle cx="1150" cy="300" r="10" fill="#d2a8ff"/>
      <circle cx="1150" cy="400" r="10" fill="#d2a8ff"/>
      <circle cx="962" cy="520" r="11" fill="#58a6ff"/>
      <circle cx="780" cy="530" r="10" fill="#3fb950"/>
      <circle cx="962" cy="600" r="11" fill="#58a6ff"/>
    </g>
  </svg>

  <div class="content">
    <p class="prompt mono"><span class="u">tobias@cv</span>:<span class="p">~</span>$ git log --graph <span class="cur">▋</span></p>
    <h1>Dr.-Ing.<br>Tobias Vinçon</h1>
    <p class="role">Group Lead · Data/AI Platforms &amp; Services</p>
    <div class="chips mono">
      <span class="chip c0">Data Mesh</span>
      <span class="chip c1">Data Governance</span>
      <span class="chip c3">AI Platforms</span>
      <span class="chip c2">PhD · Database Systems</span>
    </div>
  </div>

  <div class="domain mono">
    <span>tobiasvincon.de</span>
    <span class="tag">HEAD → main</span>
  </div>

  <div class="avatar"><img src="../assets/photo.jpg" alt=""></div>
</body>
</html>
